<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session 2: IT Act, BNS, Digital Evidence and Jurisdiction</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d2433;--mut:#5d667a;--acc:#0b5fff;--ok:#0a7d4b;--bad:#c0392b;--line:#dcdad2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a212d;--ink:#e8ecf4;--mut:#9aa5ba;--acc:#6aa0ff;--ok:#3fc78a;--bad:#ff7a6b;--line:#2c3547}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a212d;--ink:#e8ecf4;--mut:#9aa5ba;--acc:#6aa0ff;--ok:#3fc78a;--bad:#ff7a6b;--line:#2c3547}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header b{font-size:14px}header span{color:var(--mut);font-size:13px}
#bar{height:3px;background:var(--acc);width:0;transition:width .3s}
main{max-width:760px;margin:0 auto;padding:22px 18px 90px}
.tag{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:30px;line-height:1.15;margin:6px 0 10px}h2{font-size:24px;margin:6px 0 12px}h3{font-size:16px;margin:16px 0 4px}
p{margin:0 0 12px}.mut{color:var(--mut)}.sm{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0}
.opt:hover{border-color:var(--acc)}.good{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 14%,var(--card))}.wrong{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.box{background:color-mix(in srgb,var(--acc) 9%,var(--card));border-left:4px solid var(--acc);padding:10px 14px;border-radius:8px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=text]{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
code{font:13px ui-monospace,Consolas,monospace;word-break:break-all}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
nav button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600}nav button:disabled{opacity:.35}
</style></head><body>
<header><b>Session 2 · Law, Evidence, Jurisdiction</b><span id="pg"></span></header><div id="bar"></div>
<main id="m"></main>
<nav><button id="pv">← Previous</button><button id="nx">Next →</button></nav>
<script>
const $=s=>document.querySelector(s);
const rv=(a,id)=>`<div class="row" id="${id}">${a.map((x,i)=>`<button class="chip" data-i="${i}">${x[0]}</button>`).join('')}</div><div class="card" id="${id}o"><span class="mut">Tap an item above.</span></div>`;
const wr=(id,a)=>document.querySelectorAll('#'+id+' .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');$('#'+id+'o').innerHTML=a[b.dataset.i][1]});
const mcq=(id,q)=>q.map((x,i)=>`<div class="card" style="margin:8px 0"><b class="sm">${x[0]}</b>${x[1].map((o,j)=>`<button class="opt sm" data-m="${id}" data-q="${i}" data-j="${j}">${o}</button>`).join('')}</div>`).join('');
const wm=(id,q)=>document.querySelectorAll(`[data-m="${id}"]`).forEach(b=>b.onclick=()=>b.classList.add(+b.dataset.j==q[b.dataset.q][2]?'good':'wrong'));
const ACT=[["s.43 / 66 Hacking","s.43: civil compensation for unauthorised access or damage. s.66: criminal if done dishonestly or fraudulently. Up to 3 years and/or fine up to ₹5 lakh."],["s.66C / 66D Identity, personation","66C identity theft (password, e-signature). 66D cheating by personation using a computer resource. Each: up to 3 years and fine up to ₹1 lakh. The core sections for phishing and fake-profile fraud."],["s.66E Privacy","Capturing or publishing private-area images without consent. Up to 3 years and/or ₹2 lakh."],["s.67, 67A, 67B Obscene content","67 obscene, 67A sexually explicit, 67B child sexual abuse material. Heavier punishment as you go down the list."],["s.66F Cyber terrorism","Attacks on critical systems to threaten unity, security or sovereignty. Punishable up to life imprisonment."],["s.69, 69A, 70B Government powers","69: interception, monitoring, decryption. 69A: blocking of content. 70B: CERT-In, the national incident response agency."],["s.79 Intermediaries","Platforms get safe harbour if they follow due diligence and act on lawful notice. This is why takedown and data requests go to the platform's nodal officer."],["s.75, 78 Reach & who investigates","75: Act applies to offences outside India involving a computer or network in India. 78: investigation by an officer of Inspector rank or above."],["s.66A (struck down)","Struck down by the Supreme Court in Shreya Singhal (2015) as vague and violating free speech. Never register a case under 66A."]];
const BNS=[["Cheating online · s.318","BNS s.318 (IPC 420). Used with IT Act 66D in most online fraud FIRs."],["Personation · s.319","BNS s.319 (IPC 416/419). Fake officer, fake bank staff, fake profile."],["Extortion · s.308","BNS s.308 (IPC 383-384). Sextortion and blackmail with morphed images."],["Forgery · s.336, 340","Forged documents and forged electronic records; using them as genuine."],["Conspiracy · s.61","IPC 120B equivalent. Key for mule-account and multi-person fraud chains."],["Organised crime · s.111","New offence. Covers continuing unlawful activity by a syndicate, cyber-crime included."],["Stalking, intimidation · s.78, 351","Cyberstalking (IPC 354D) and criminal intimidation (IPC 506)."],["Procedure: BNSS","s.173 e-FIR and zero FIR · s.94 notice to produce documents/data · s.105 video recording of search and seizure · s.106 seizure · s.176(3) forensic expert visit for offences with 7+ years."]];
const CUS=["Identify and secure the device or account","Photograph the scene and device state","Seize and seal with a seizure memo and witnesses","Image the data and compute the hash","Record every handover in the custody log","Analyse only the copy, never the original","Issue the certificate and produce in court"];
const JU=[["Zero FIR / e-FIR","Any police station can register the complaint, then transfer it. Never turn a victim away because the crime happened elsewhere. Also: NCRP portal and 1930 helpline."],["Victim here, accused in another state","Coordinate with the other state's police, serve notice, seek transit remand. Alert the bank early and trace accounts first."],["Servers or platforms abroad","Formal route: letter of request and MLAT through MHA (BNSS reciprocal arrangements). Slow. Use platform law-enforcement portals for preservation and emergency requests."],["Data held by intermediaries","Notice under BNSS s.94 with IT Act s.79 context. Ask for preservation first, disclosure second."],["Extra-territorial reach","IT Act s.75 and BNSS s.208 allow India to proceed against offences committed abroad that target Indian systems or victims. Arrest and trial still need cooperation."]];
const CASES=[["Shreya Singhal (2015)","Two young women were arrested in Maharashtra in 2012 for a Facebook post and a 'like', under s.66A. The Supreme Court struck down s.66A as unconstitutional. <b>Lesson:</b> a section can be good law on paper and still fall; check current status."],["Digumarti / Bazee.com (2016)","A platform executive was prosecuted under IPC and the IT Act for obscene listings. The Supreme Court held that where the IT Act fully covers the act, it prevails over the general penal law. <b>Lesson:</b> choose sections carefully; confirm with the prosecutor."],["Khotkar (2020)","The Supreme Court held that the certificate under s.65B Evidence Act is mandatory when electronic evidence is produced as a copy, overruling a more relaxed earlier view. <b>Lesson:</b> under BSA s.63 the certificate (with hash) decides admissibility."],["Cosmos Bank attack (2018)","About ₹94 crore was stolen from a Pune bank: malware on its payment switch plus fraudulent SWIFT transfers, with ATM withdrawals in many countries within hours. <b>Lesson:</b> a single attack spans servers, countries and banks; preserve logs and move on money at once."]];
const TOOLS=[["FTK Imager","Forensic imaging, hash verification and previews. Free. Covered in Day 3."],["Autopsy / Sleuth Kit","Free, open-source case analysis: deleted files, timelines, browser and file history."],["Magnet AXIOM, Cellebrite UFED","Commercial mobile and cloud extraction suites used by cyber labs."],["Volatility","Memory analysis for running processes, connections and malware."],["Wireshark","Network capture and analysis; shows what a machine actually communicated."],["Email header analyser","Paste a full email header to trace sending servers and spoofing. MXToolbox is one free option."],["WHOIS / ICANN lookup","Domain registration details of phishing and fake sites."],["ExifTool","Reads metadata in photos and documents: device, time, editing software."],["Hashing: certutil, sha256sum","Windows: <code>certutil -hashfile file.png SHA256</code> · Linux: <code>sha256sum file.png</code>"]];
const MA=[["Phishing site copies a bank login to steal passwords. Main IT Act section?",["66D cheating by personation","66F cyber terrorism","67 obscene content"],0],["Accused uses a victim's password to log in as them. Section?",["66C identity theft","69 interception","79 intermediary"],0],["A group attacks a power-grid control system to threaten national security.",["66E privacy","66F cyber terrorism","43 compensation"],1],["Authorities lawfully monitor a suspect's communications. Power under?",["s.66A","s.69","s.67B"],1]];
const MJ=[["Victim in Kohima loses money to an account in another state. Best first move?",["Ask victim to travel there","Register a zero FIR / NCRP complaint and alert the bank now","Wait for the other state to call"],1]];
const QZ=[["Which law now governs admissibility of electronic evidence?",["Indian Evidence Act, 1872","Bharatiya Sakshya Adhiniyam (BSA) 2023","IT Act 2000 only"],1],["Why do we hash a seized drive image?",["To compress it","To prove it was not altered","To encrypt it"],1],["Section 66A today is…",["In force for hate speech","Struck down","Replaced by s.66B"],1],["A foreign platform holds the data. Fastest first step?",["Letter rogatory","Preservation request via platform portal","Wait for trial"],1]];
const S=[
()=>`<div class="tag">Session 2 · 90 minutes</div><h1>Law, Digital Evidence and Jurisdiction</h1><p class="mut">IT Act, Bharatiya Nyaya Sanhita, digital evidence and jurisdiction, with real cases and tools.</p><div class="grid"><div class="card"><h3>1 · IT Act</h3><span class="mut sm">20 min</span></div><div class="card"><h3>2 · BNS and BNSS</h3><span class="mut sm">15 min</span></div><div class="card"><h3>3 · Digital evidence</h3><span class="mut sm">20 min</span></div><div class="card"><h3>4 · Jurisdiction</h3><span class="mut sm">15 min</span></div><div class="card"><h3>5 · Cases and tools</h3><span class="mut sm">15 min</span></div><div class="card"><h3>6 · Quiz</h3><span class="mut sm">5 min</span></div></div><p class="sm mut">Use ← → keys or the buttons below. Verify section numbers against the gazetted text before citing in a case.</p>`,
()=>`<div class="tag">Part 1</div><h2>Information Technology Act, 2000</h2>${rv(ACT,'ac')}<h3>Which section?</h3>${mcq('ma',MA)}`,
()=>`<div class="tag">Part 2</div><h2>BNS 2023 and BNSS</h2><p>From 1 July 2024 the BNS replaced the IPC. Online crimes usually get an IT Act section plus a BNS section.</p>${rv(BNS,'bn')}<div class="box"><b>Rule of thumb:</b> IT Act for the technology act (hacking, personation), BNS for the crime (cheating, extortion, conspiracy). Where the IT Act fully covers an act, it can prevail.</div>`,
()=>`<div class="tag">Part 3</div><h2>Digital evidence</h2><div class="box"><b>BSA 2023:</b> s.61 an electronic record is admissible like paper. s.63 certificate (Part A by the person in charge, Part B by the expert), including hash values.</div><h3>Try it: hash an exhibit</h3><p class="sm">Original text hash is fixed below. Edit the text by one character and watch the hash change.</p><input type="text" id="hi" value="Transfer Rs 10,000 to account 4521"><p class="sm" style="margin-top:8px"><b>Original:</b><br><code id="h0"></code></p><p class="sm"><b>Your text:</b><br><code id="h1"></code></p><p id="hr"></p><h3>Chain of custody: tap in order</h3><div id="cu" class="row"></div>`,
()=>`<div class="tag">Part 4</div><h2>Jurisdiction issues</h2>${rv(JU,'ju')}<h3>What would you do?</h3>${mcq('mj',MJ)}`,
()=>`<div class="tag">Real cases</div><h2>Case studies</h2>${rv(CASES,'cs')}`,
()=>`<div class="tag">Toolbox</div><h2>Tools for digital evidence</h2><p class="sm mut">Use only authorised tools on lawfully seized material, working on the image, not the original.</p>${rv(TOOLS,'tl')}`,
()=>`<div class="tag">Wrap-up</div><h2>Exit quiz</h2>${mcq('qz',QZ)}<div class="box"><b>Takeaways:</b> IT Act plus BNS together · BSA s.63 certificate and hash · preserve first, disclose later · any police station can start with a zero FIR.</div>`];
const H=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const I=[()=>{},()=>{wr('ac',ACT);wm('ma',MA)},()=>wr('bn',BNS),async()=>{const o="Transfer Rs 10,000 to account 4521";let a="";try{a=await H(o);$('#h0').textContent=a}catch(e){$('#h0').textContent='Hashing needs a secure (https) page.';return}const u=async()=>{const h=await H($('#hi').value);$('#h1').textContent=h;$('#hr').innerHTML=h==a?'<b style="color:var(--ok)">Match: unchanged.</b>':'<b style="color:var(--bad)">Different: evidence altered.</b>'};$('#hi').oninput=u;u();let n=0;const sh=CUS.map((t,i)=>[t,i]).sort((x,y)=>(x[1]*5+3)%7-(y[1]*5+3)%7);$('#cu').innerHTML=sh.map(x=>`<button class="opt sm" data-i="${x[1]}">${x[0]}</button>`).join('');document.querySelectorAll('#cu .opt').forEach(b=>b.onclick=()=>{if(+b.dataset.i==n){b.classList.add('good');b.textContent=(n+1)+'. '+b.textContent;n++}else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),500)}})},()=>{wr('ju',JU);wm('mj',MJ)},()=>wr('cs',CASES),()=>wr('tl',TOOLS),()=>wm('qz',QZ)];
let p=0;
function go(n){p=Math.max(0,Math.min(S.length-1,n));$('#m').innerHTML=S[p]();I[p]();$('#pg').textContent=(p+1)+' / '+S.length;$('#bar').style.width=((p+1)/S.length*100)+'%';$('#pv').disabled=p==0;$('#nx').disabled=p==S.length-1;scrollTo(0,0);try{history.replaceState(null,'','#'+(p+1))}catch(e){}}
$('#pv').onclick=()=>go(p-1);$('#nx').onclick=()=>go(p+1);
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')go(p+1);if(e.key=='ArrowLeft')go(p-1)});
go((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
